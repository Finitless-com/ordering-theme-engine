name: Publish

# A tag v<version> publishes that version to npmjs, public. A version
# already published is never replaced: the registry refuses it and the job fails.
#
# It authenticates with npm's trusted publishing (OIDC): no token secret, the
# registry trusts this workflow of this repository. npm only lets a package
# that already exists configure its trusted publisher, so the first version
# is published by hand (`npm publish --access public` from a maintainer's
# machine); every later one goes through this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: The tag is the package's version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Trusted publishing needs npm 11.5.1 or later; Node 22 brings npm 10.
      - name: Set up npm for trusted publishing
        run: npm install -g npm@11.6.2

      # publishConfig names the registry; prepack builds dist/ again.
      - name: Publish
        run: npm publish --provenance --access public
